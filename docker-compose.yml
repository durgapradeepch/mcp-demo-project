services:
  neo4j:
    image: neo4j:5.13.0
    container_name: neo4j-mcp-server
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/testing@neo4j
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ./neo4j-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p testing@neo4j 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mcp-network

  # MCP Server (existing Node.js service)
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEO4J_HOST=neo4j
      - NEO4J_BOLT_PORT=7687
      - NEO4J_HTTP_PORT=7474
      - NEO4J_AUTH=neo4j/testing@neo4j
      - SERVER_PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_CHOICE=${LLM_CHOICE}
      - MODEL_NAME=${MODEL_NAME}
      - LLAMA_API_ENDPOINT=${LLAMA_API_ENDPOINT}
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      - VICTORIA_LOGS_API_URL=${VICTORIA_LOGS_API_URL}
      - MANIFEST_API_URL=${MANIFEST_API_URL}
      - MANIFEST_API_KEY=${MANIFEST_API_KEY}
      - MANIFEST_ORG_KEY=${MANIFEST_ORG_KEY}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/mcp/tools" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    networks:
      - mcp-network

  # LangGraph Orchestrator (new Python service)
  langgraph-orchestrator:
    build:
      context: ./langgraph-orchestrator
      dockerfile: Dockerfile
    container_name: langgraph-orchestrator
    ports:
      - "8000:8000"
    environment:
      - MCP_SERVER_URL=http://mcp-server:3001
      - LANGGRAPH_HOST=0.0.0.0
      - LANGGRAPH_PORT=8000
      - LOG_LEVEL=info
      - MAX_RETRIES=3
      - STAGE_TIMEOUT=60.0
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8000/health', timeout=5); exit(0 if r.status_code == 200 else 1)" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    restart: unless-stopped
    networks:
      - mcp-network

  # Frontend (existing React service)  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_LANGGRAPH_URL=http://localhost:8000
    depends_on:
      mcp-server:
        condition: service_healthy
      langgraph-orchestrator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp-network

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  mcp-network:
    driver: bridge
